name: Process Clipping PipeLine
on:
  workflow_dispatch:
    inputs:
      username:
        required: true
      time:
        required: true
      jobId:
        required: true
jobs:
  CLIP:
    runs-on: ubuntu-latest
    environment: KEYS
    env:
      SB_Url: ${{secrets.SB_URL}}
      SB_Key: ${{secrets.SB_KEY}}
      Keep_key: ${{secrets.KEEP_KEY}}
      G_Key: ${{secrets.G_KEY}}
      Ai_Key: ${{secrets.AI_KEY}}
      Keep_Id: -5113371237

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        ffmpeg -version

    - name: Install dependencies
      run: npm ci

    - name: Process Clipping PipeLine
      run: npx tsx ./scripts/publish/publish.ts
