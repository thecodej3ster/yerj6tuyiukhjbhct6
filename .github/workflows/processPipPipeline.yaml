name: processPipPipeline

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Enter Step '
        required: false
        default: 'pip'

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'

    # Fast FFmpeg setup with automatic binary caching
    - name: Set up FFmpeg
      uses: federicocarboni/setup-ffmpeg@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: npm ci

    - name: Pip Video
      env:
        SB_Url: https://emosvfihxxpaqtmlniwe.supabase.co
        SB_Key: sb_publishable_k9AFn4eMxM1Yid-I1gh_oA_epL6Cni9
        Keep_key: 8874078883:AAG0WVQr1GdJxjjaw_7KsbtrEz9CTgYb3kk
        Keep_Id: -5113371237
      run: npx tsx ./scripts/pip.ts
