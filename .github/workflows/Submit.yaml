name: Process Submit PipeLine
on:
  workflow_dispatch:
    inputs:
      campaignId:
        required: true
jobs:
  SUBMIT:
    environment: KEYS
    runs-on: ubuntu-latest
    env:
      SB_Url: ${{secrets.SB_URL}}
      SB_Key: ${{secrets.SB_KEY}}
      Creds: ${{secrets.CREDS}}
      Locations: ${{secrets.LOCATIONS}}
      Proxy_Tkn: ${{secrets.PROXY_TKN}}
      Proxy_Api: ${{secrets.PROXY_API}}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Process Submit PipeLine
      run: npx tsx ./scripts/submit/track/index.ts
