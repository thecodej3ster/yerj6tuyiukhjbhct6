name: Process Auth PipeLine
on:
  workflow_dispatch:
    inputs:
      type:
        required: true
jobs:
  AUTH:
    environment: KEYS
    runs-on: ubuntu-latest
    env:
      SB_Url: ${{secrets.SB_URL}}
      SB_Key: ${{secrets.SB_KEY}}
      G_Key: ${{secrets.G_KEY}}
      Environment: KEYS
      Creds: ${{secrets.CREDS}}
      Locations: ${{secrets.LOCATIONS}}
      Proxy_Tkn: ${{secrets.PROXY_TKN}}
      Proxy_Api: ${{secrets.PROXY_API}}
      Auths: ${{secrets.AUTHS}}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Process Auth PipeLine
      run: npx tsx ./scripts/auth/index.ts